<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lennox Hex | Perfil Oficial</title>
    <style>
        #video-fondo {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -1; transform: translate(-50%, -50%); 
            object-fit: cover;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .reveal { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
        body {
            font-family: 'Segoe UI', sans-serif; margin: 0; color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center;
            overflow-x: hidden; background: #000;
        }
        .contenido { position: relative; z-index: 1; width: 85%; max-width: 300px; padding: 40px 0; }
        .foto-perfil { width: 110px; height: 110px; border-radius: 50%; border: 2px solid white; object-fit: cover; margin-bottom: 20px; }
        .iconos-rapidos { display: flex; justify-content: center; align-items: center; gap: 35px; margin-bottom: 30px; }
        .icono-rapido-img { width: 40px; height: 40px; filter: drop-shadow(0 0 4px rgba(255,255,255,0.7)); }
        h1 { font-size: 22px; margin: 5px 0; font-weight: 700; }
        .descripcion { font-size: 12px; color: #bbb; margin-bottom: 30px; line-height: 1.5; }
        .link-container {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            margin: 12px auto; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .link-main { display: flex; align-items: center; flex-grow: 1; padding: 12px 15px; color: white; text-decoration: none; font-weight: 500; font-size: 14px; text-align: left; }
        .more-btn { padding: 12px 18px; cursor: pointer; font-size: 16px; color: rgba(255,255,255,0.5); border-left: 1px solid rgba(255,255,255,0.1); }
        .icon { width: 20px; height: 20px; margin-right: 12px; }
        footer { position: relative; z-index: 1; margin: 30px 0; font-size: 10px; color: rgba(255,255,255,0.3); }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 8px 18px; border-radius: 20px; font-size: 12px; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="video-fondo"><source src="fondo.mp4" type="video/mp4"></video>
    <div class="overlay"></div>
    <div id="toast">Copiado al portapapeles 📎</div>

    <div class="contenido">
        <img src="foto.jpeg" class="foto-perfil reveal">
        <div class="iconos-rapidos reveal" style="animation-delay: 0.1s;">
            <a href="https://www.tiktok.com/@lennoxhex.edits" target="_blank"><img src="tiktok_icono.png" class="icono-rapido-img"></a>
            <a href="https://www.youtube.com/@lennoxhex" target="_blank"><img src="youtube_icono.png" class="icono-rapido-img"></a>
            <a href="https://open.spotify.com/intl-es/artist/53gaj4knJSgB7U8PypzmZF?si=cZEx-e08Q0GJplzZUhgrfQ" target="_blank"><img src="spotify_icono.png" class="icono-rapido-img"></a>
        </div>

        <h1 class="reveal" style="animation-delay: 0.15s;">@lennoxhex.edits</h1>
        <p class="descripcion reveal" style="animation-delay: 0.2s;">Editor Ae • 4k High Quality • Soundtrack composer</p>

        <div class="link-container reveal" style="animation-delay: 0.25s;">
            <a href="https://www.youtube.com/@lennoxhex" class="link-main" target="_blank"><img src="youtube.png" class="icon"> YouTube</a>
            <div class="more-btn" onclick="compartir('YouTube - Lennox Hex', 'https://www.youtube.com/@lennoxhex')">⋮</div>
        </div>
        
        <div class="link-container reveal" style="animation-delay: 0.3s;">
            <a href="https://www.tiktok.com/@lennoxhex.edits" class="link-main" target="_blank"><img src="tiktok.png" class="icon"> TikTok</a>
            <div class="more-btn" onclick="compartir('TikTok - Lennox Hex', 'https://www.tiktok.com/@lennoxhex.edits')">⋮</div>
        </div>

        <div class="link-container reveal" style="animation-delay: 0.35s;">
            <a href="https://www.instagram.com/lennox_hex" class="link-main" target="_blank"><img src="instagram.png" class="icon"> Instagram</a>
            <div class="more-btn" onclick="compartir('Instagram - Lennox Hex', 'https://www.instagram.com/lennox_hex')">⋮</div>
        </div>

        <div class="link-container reveal" style="animation-delay: 0.4s;">
            <a href="https://open.spotify.com/intl-es/artist/53gaj4knJSgB7U8PypzmZF?si=cZEx-e08Q0GJplzZUhgrfQ" class="link-main" target="_blank"><img src="spotify.png" class="icon"> Spotify</a>
            <div class="more-btn" onclick="compartir('Spotify - Lennox Hex', 'https://open.spotify.com/intl-es/artist/53gaj4knJSgB7U8PypzmZF?si=cZEx-e08Q0GJplzZUhgrfQ')">⋮</div>
        </div>

        <div class="link-container reveal" style="animation-delay: 0.45s;">
            <a href="https://music.apple.com/es/artist/lennox-hex/1662742026" class="link-main" target="_blank"><img src="apple.png" class="icon"> Apple Music</a>
            <div class="more-btn" onclick="compartir('Apple Music - Lennox Hex', 'https://music.apple.com/es/artist/lennox-hex/1662742026')">⋮</div>
        </div>

        <div class="link-container reveal" style="animation-delay: 0.5s;">
            <a href="https://music.youtube.com/channel/UC7i0dhWZjZu3yqC-eNAMw9Q" class="link-main" target="_blank"><img src="ytmusic.png" class="icon"> YouTube Music</a>
            <div class="more-btn" onclick="compartir('YouTube Music - Lennox Hex', 'https://music.youtube.com/channel/UC7i0dhWZjZu3yqC-eNAMw9Q')">⋮</div>
        </div>

        <div class="link-container reveal" style="animation-delay: 0.55s;">
            <a href="https://deezer.com/us/artist/195997887" class="link-main" target="_blank"><img src="deezer.png" class="icon"> Deezer</a>
            <div class="more-btn" onclick="compartir('Deezer - Lennox Hex', 'https://deezer.com/us/artist/195997887')">⋮</div>
        </div>
    </div>

    <footer>© 2026 @lennoxhex.edits - Todos los derechos reservados.</footer>

    <script>
        async function compartir(titulo, url) {
            if (navigator.share) {
                // Si el navegador soporta el menú desplegable nativo (Móviles)
                try {
                    await navigator.share({
                        title: titulo,
                        text: 'Echa un vistazo al perfil de Lennox Hex:',
                        url: url
                    });
                } catch (err) {
                    console.log('Error al compartir');
                }
            } else {
                // Si está en PC o navegador antiguo, simplemente copia el link
                navigator.clipboard.writeText(url);
                const t = document.getElementById('toast');
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 1500);
            }
        }
    </script>
</body>
</html>
